# Builds the Expo web bundle and publishes it to GitHub Pages.
#
# The deployed site is the real app bundle, but it is static: there is no
# backend behind it, which the app states on its welcome screen. See
# `mobile/src/components/demo-notice.tsx`.

name: Deploy web app to Pages

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the web bundle changes.
    paths:
      - 'mobile/**'
      - '.github/workflows/pages.yml'
  # Allows a manual redeploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export web bundle
        env:
          # Pages serves this repo from /amora/, so the bundle must be built
          # with a matching base URL or every asset path 404s.
          EXPO_BASE_URL: /amora
          # The backend the published app talks to. Set this as a repository
          # *variable* (Settings -> Secrets and variables -> Actions ->
          # Variables -> New variable, name EXPO_PUBLIC_API_URL, value
          # https://your-api-domain/api/v1).
          #
          # It is a variable rather than a secret on purpose: it is baked into
          # a public JavaScript bundle, so it is not confidential, and secrets
          # are masked in logs which makes a wrong value hard to debug.
          #
          # Left unset, the build falls back to http://localhost:8000, and the
          # welcome screen tells visitors the demo has no backend attached.
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -n "$EXPO_PUBLIC_API_URL" ]; then
            echo "Building against API: $EXPO_PUBLIC_API_URL"
            case "$EXPO_PUBLIC_API_URL" in
              https://*) ;;
              *)
                echo "::error::EXPO_PUBLIC_API_URL must use https:// — GitHub Pages is served over HTTPS, so a plain-HTTP API is blocked by the browser as mixed content."
                exit 1
                ;;
            esac
          else
            echo "::warning::EXPO_PUBLIC_API_URL is not set — publishing an interface-only demo with no backend attached."
          fi
          npx expo export --platform web --output-dir dist

      - name: Disable Jekyll
        # Expo emits assets under `_expo/`, and Jekyll strips underscore-
        # prefixed directories. Without this the site loads no JavaScript.
        run: touch dist/.nojekyll

      - name: Add SPA fallback
        # expo-router uses client-side routing. Copying index.html to 404.html
        # makes GitHub Pages serve the app for deep links such as /amora/login
        # instead of its own 404 page.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
