[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole session. Both of these are required: fixtures
# and tests must share a loop, or asyncpg connections created by a fixture are
# "attached to a different loop" when a test uses them.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning:passlib.*
